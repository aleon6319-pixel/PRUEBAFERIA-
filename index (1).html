<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Guardián del Manglar: Respira Guayaquil</title>
<style>
html,body{margin:0;height:100%;background:#0a2622;color:#e8f4ea;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#w{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px}
canvas{width:min(100vw,calc((100vh - 96px)*1.6));aspect-ratio:8/5;background:#123;touch-action:none;border:2px solid #2f6b4f;border-radius:6px}
#c{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;user-select:none;-webkit-user-select:none}
#c button{font:600 15px Georgia,serif;min-width:44px;height:44px;border:2px solid #7fc49a;background:#12403a;color:#e8f4ea;border-radius:8px;padding:0 12px;touch-action:none}
#c button:active{background:#2f8a5f}
#c .g{display:flex;gap:6px}
</style></head><body>
<div id="w">
<canvas id="cv" width="800" height="500"></canvas>
<div id="c">
 <div class="g"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>
 <div class="g"><button data-k="z">Plantar (Z)</button><button data-k="x">Limpiar (X)</button></div>
 <button id="sb" style="display:none">Conectar ESP32</button>
</div></div>
<script>
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const W=800,H=500,COLS=10,ROWS=5,CW=80,RH=66,FT=140,GOAL=8,TOTAL=180;
let st='menu',P,plots,en,health,tm,t,tide,smog,smogT,nextSmog,acc,oilT,logT,msg,msgT,cd,ha,result='';
const keys={};let sx=0,sy=0,realAir=null,serialOn=false;
let AC;function beep(f,d,ty){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=ty||'square';o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function say(m){msg=m;msgT=2.2}
function reset(){P={x:400,y:300};plots=[...Array(ROWS)].map(()=>[...Array(COLS)].map(()=>({s:0,a:0})));en=[];health=60;tm=TOTAL;t=0;tide=0;smog=0;smogT=0;nextSmog=25;acc=0;oilT=8;logT=18;msg='';msgT=0;cd=0;ha=0}
function cell(x,y){return{c:Math.floor(x/CW),r:Math.floor((y-FT)/RH)}}
function plant(){if(cd>0)return;cd=.2;const{c,r}=cell(P.x,P.y);if(r<0||r>=ROWS||c<0||c>=COLS)return;
 if(tide>.5){say('Marea alta: espera la marea baja para plantar');beep(150,.15);return}
 const p=plots[r][c];if(p.s==0){p.s=1;p.a=0;beep(520,.1,'triangle')}}
function clean(){if(cd>0)return;cd=.25;let n=0;en=en.filter(e=>{if(Math.hypot(e.x-P.x,e.y-P.y)<75){n++;return false}return true});
 if(n){beep(760,.12,'triangle');health=Math.min(100,health+n*1.5)}else beep(200,.08)}
function start(){reset();st='play';sendH(true)}
addEventListener('keydown',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();if(!keys[k]){if(st=='play'){if(k=='z'||k==' ')plant();if(k=='x')clean()}else if(k=='Enter'||k==' ')start()}keys[k]=1;if(k.startsWith('Arrow')||k==' ')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});
cv.addEventListener('pointerdown',()=>{if(st!='play')start()});
document.querySelectorAll('#c button[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(st!='play'){start();return}keys[k]=1;if(k=='z')plant();if(k=='x')clean()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
/* ---- ESP32 por Web Serial: líneas "x,y,b1,b2,aire" (x,y 0-4095; aire 0-1) ---- */
let wr,sb=document.getElementById('sb'),lastH=0,pb1=0,pb2=0;
if('serial' in navigator)sb.style.display='';
sb.onclick=async()=>{try{const port=await navigator.serial.requestPort();await port.open({baudRate:115200});
 wr=port.writable.getWriter();serialOn=true;sb.textContent='ESP32 conectado';
 const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable);const rd=dec.readable.getReader();let buf='';
 for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;let i;while((i=buf.indexOf('\n'))>=0){parseLine(buf.slice(0,i));buf=buf.slice(i+1)}}}
 catch(e){serialOn=false;realAir=null;sx=sy=0;sb.textContent='Conectar ESP32'}};
function parseLine(l){const p=l.trim().split(',').map(Number);if(p.length<5||p.some(isNaN))return;
 sx=(p[0]-2048)/2048;sy=(p[1]-2048)/2048;if(Math.abs(sx)<.25)sx=0;if(Math.abs(sy)<.25)sy=0;
 realAir=Math.max(0,Math.min(1,p[4]));
 if(st=='play'){if(p[2]&&!pb1)plant();if(p[3]&&!pb2)clean()}else if((p[2]&&!pb1)||(p[3]&&!pb2))start();pb1=p[2];pb2=p[3]}
function sendH(f){if(!wr)return;const n=performance.now();if(!f&&n-lastH<300)return;lastH=n;
 wr.write(new TextEncoder().encode('H,'+Math.round(health)+',hit\n'.replace(',hit','')));}
/* ---- lógica ---- */
function spawn(k){const r=Math.floor(Math.random()*ROWS),y=FT+r*RH+RH/2;
 if(k=='t')en.push({k,x:W+20,y:FT+Math.random()*ROWS*RH,v:0,a:Math.random()*6});
 if(k=='o')en.push({k,x:CW*(Math.floor(Math.random()*COLS)+.5),y,a:0});
 if(k=='l')en.push({k,x:W+20,y,a:0})}
function update(dt){
 t+=dt;tm-=dt;cd-=dt;msgT-=dt;ha=0;
 tide=(1-Math.cos(t*2*Math.PI/30))/2;
 if(realAir!==null)smog=realAir;else{if(smogT>0){smogT-=dt;smog=.8}else smog=0;nextSmog-=dt;if(nextSmog<0){smogT=10;nextSmog=30+Math.random()*20;say('¡Smog! El aire se ensucia');beep(110,.4,'sawtooth')}}
 const dx=((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0)+sx,dy=((keys.ArrowDown||keys.s)?1:0)-((keys.ArrowUp||keys.w)?1:0)+sy;
 P.x=Math.max(20,Math.min(W-20,P.x+dx*210*dt));P.y=Math.max(FT-20,Math.min(H-50,P.y+dy*210*dt));
 const dif=1+t/120;
 acc+=dt*(.5+tide*.6+smog*.9)*dif;while(acc>1){acc--;spawn('t')}
 oilT-=dt;if(oilT<0){oilT=(12-smog*4)/dif;spawn('o')}
 logT-=dt;if(logT<0){logT=22/dif;spawn('l');say('¡Talador ilegal! Ahuyéntalo con X')}
 let drain=0;
 for(const e of en){const c=Math.floor(e.x/CW),r=Math.floor((e.y-FT)/RH),p=(r>=0&&r<ROWS&&c>=0&&c<COLS)?plots[r][c]:null;
  if(e.k=='t'){e.x-=(15+tide*45)*dt;e.a+=dt;if(p&&p.s)drain+=1.2}
  if(e.k=='o'){e.a+=dt;if(p&&p.s){drain+=1;if(e.a>7){p.s=0;e.a=0;beep(100,.3,'sawtooth')}}}
  if(e.k=='l'){e.x-=24*dt;if(p&&p.s){p.s=0;beep(90,.35,'sawtooth');say('¡Talaron un manglar!')}}}
 en=en.filter(e=>e.x>-30);
 let mat=0;for(const row of plots)for(const p of row){if(p.s){p.a+=dt;if(p.s==1&&p.a>10){p.s=2;beep(880,.12,'triangle')}}if(p.s==2)mat++;ha+=p.s==2?.4:p.s==1?.1:0}
 const before=health;health+=(mat*.03-smog*.6-drain)*dt;health=Math.max(0,Math.min(100,health));
 if(health<before-.05&&Math.random()<.05)beep(130,.06);
 sendH();
 if(ha>=GOAL){st='end';result='win'}else if(health<=0||tm<=0){st='end';result='lose'}
 if(st=='end')sendH(true)}
/* ---- dibujo ---- */
function txt(s,x,y,sz,col,al){g.font=(sz||16)+'px Georgia,serif';g.fillStyle=col||'#fff';g.textAlign=al||'left';g.fillText(s,x,y)}
function draw(){
 const sg=g.createLinearGradient(0,0,0,FT);sg.addColorStop(0,'#7cc7e6');sg.addColorStop(1,'#d8efe3');g.fillStyle=sg;g.fillRect(0,0,W,FT);
 g.fillStyle='#e9c46a';g.beginPath();g.arc(680,55,26,0,7);g.fill();
 g.fillStyle='#2a6b4a';for(let i=0;i<14;i++){g.beginPath();g.arc(i*62+20,FT-6,34+(i*7%14),Math.PI,0);g.fill()}
 g.fillStyle='#6b4a2f';g.fillRect(0,FT,W,ROWS*RH);g.fillStyle='#5a3d27';g.fillRect(0,FT+ROWS*RH,W,H-FT-ROWS*RH);
 g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=1;for(let c=0;c<=COLS;c++){g.beginPath();g.moveTo(c*CW,FT);g.lineTo(c*CW,FT+ROWS*RH);g.stroke()}for(let r=0;r<=ROWS;r++){g.beginPath();g.moveTo(0,FT+r*RH);g.lineTo(W,FT+r*RH);g.stroke()}
 const cp=cell(P.x,P.y);if(st=='play'&&cp.r>=0&&cp.r<ROWS&&cp.c>=0&&cp.c<COLS){g.fillStyle=tide>.5?'rgba(255,255,255,.1)':'rgba(255,240,150,.25)';g.fillRect(cp.c*CW,FT+cp.r*RH,CW,RH)}
 if(plots)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=plots[r][c];if(!p.s)continue;const x=c*CW+CW/2,y=FT+r*RH+RH/2;
  if(p.s==1){g.strokeStyle='#7ab648';g.lineWidth=3;g.beginPath();g.moveTo(x,y+14);g.lineTo(x,y-8);g.stroke();g.fillStyle='#9fd356';g.beginPath();g.ellipse(x-6,y-9,7,4,-.5,0,7);g.ellipse(x+6,y-9,7,4,.5,0,7);g.fill()}
  else{g.strokeStyle='#4a2f1a';g.lineWidth=3;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x+i*4,y-2);g.quadraticCurveTo(x+i*11,y+10,x+i*14,y+24);g.stroke()}
   g.fillStyle='#1f7a4a';g.beginPath();g.arc(x,y-10,20,0,7);g.arc(x-14,y-2,13,0,7);g.arc(x+14,y-2,13,0,7);g.fill();g.fillStyle='#2ea86a';g.beginPath();g.arc(x-4,y-15,10,0,7);g.fill()}}
 const wl=.1+tide*.5;g.fillStyle='rgba(40,120,170,'+wl+')';g.fillRect(0,FT,W,ROWS*RH);
 g.strokeStyle='rgba(255,255,255,'+(.15+tide*.3)+')';g.lineWidth=2;for(let i=0;i<8;i++){const y=FT+20+i*42+Math.sin(t*2+i)*4;g.beginPath();for(let x=0;x<=W;x+=20)g.lineTo(x,y+Math.sin(x/30+t*2+i)*3);g.stroke()}
 if(en)for(const e of en){
  if(e.k=='t'){g.save();g.translate(e.x,e.y+Math.sin(e.a*2)*3);g.rotate(Math.sin(e.a));g.fillStyle='#d8dde2';g.fillRect(-8,-5,16,10);g.fillStyle='#c0392b';g.fillRect(-8,-5,5,10);g.restore()}
  if(e.k=='o'){g.fillStyle='rgba(10,10,15,.85)';g.beginPath();g.ellipse(e.x,e.y,32,20,0,0,7);g.fill();g.strokeStyle='#5b3a8c';g.lineWidth=2;g.beginPath();g.ellipse(e.x-4,e.y-3,16,8,0,0,7);g.stroke()}
  if(e.k=='l'){g.fillStyle='#b5451b';g.fillRect(e.x-9,e.y-16,18,26);g.fillStyle='#f1c27d';g.beginPath();g.arc(e.x,e.y-22,8,0,7);g.fill();g.fillStyle='#f4b400';g.fillRect(e.x-10,e.y-31,20,6);g.strokeStyle='#444';g.lineWidth=3;g.beginPath();g.moveTo(e.x-14,e.y);g.lineTo(e.x-24,e.y-20);g.stroke();g.fillStyle='#999';g.fillRect(e.x-32,e.y-26,12,8)}}
 if(P){g.fillStyle='#f4a259';g.beginPath();g.arc(P.x,P.y,15,0,7);g.fill();g.fillStyle='#1f7a4a';g.beginPath();g.ellipse(P.x,P.y-12,20,7,0,0,7);g.fill();g.fillStyle='#222';g.fillRect(P.x-6,P.y-3,3,4);g.fillRect(P.x+3,P.y-3,3,4)}
 if(smog>0){g.fillStyle='rgba(100,88,74,'+smog*.5+')';g.fillRect(0,0,W,H)}
 if(st!='menu'){
  g.fillStyle='rgba(6,30,26,.75)';g.fillRect(0,0,W,42);
  txt('Restaurado: '+ha.toFixed(1)+' / '+GOAL+' ha',12,27,18,'#bff0c9');
  txt('Tiempo '+Math.max(0,Math.ceil(tm))+'s',250,27,18,'#fff');
  txt(tide>.5?'Marea ALTA: limpia':'Marea BAJA: planta',350,27,16,tide>.5?'#8fd3f4':'#f0d58c');
  g.fillStyle='#333';g.fillRect(560,12,150,16);const hc=health>60?'#3fbf6f':health>30?'#e6b93a':'#d9483b';g.fillStyle=hc;g.fillRect(560,12,150*health/100,16);
  txt('Salud',722,27,14,'#fff');
  if(smog>0)txt('Aire: SMOG',480,27,14,'#ffb27a','left');
  if(msgT>0)txt(msg,W/2,80,20,'#fff','center');
  txt(serialOn?'Control ESP32 activo':'Flechas/WASD mover · Z plantar (marea baja) · X limpiar',W/2,H-12,14,'#f3e9d0','center')}
 if(st=='menu'||st=='end'){g.fillStyle='rgba(6,30,26,.85)';g.fillRect(0,0,W,H);
  if(st=='menu'){txt('Guardián del Manglar',W/2,150,46,'#bff0c9','center');txt('Respira Guayaquil',W/2,195,28,'#f0d58c','center');
   txt('Planta manglares con marea baja. Limpia basura, petróleo y taladores con marea alta.',W/2,260,17,'#e8f4ea','center');
   txt('Restaura '+GOAL+' hectáreas antes de que se acaben los '+TOTAL+' segundos. ODS 13: Acción por el Clima.',W/2,288,17,'#e8f4ea','center');
   txt('El smog acelera la basura y desgasta al manglar.',W/2,316,17,'#e8f4ea','center')}
  else{txt(result=='win'?'¡Manglar restaurado!':'El manglar no resistió',W/2,170,44,result=='win'?'#bff0c9':'#ff9c8a','center');
   txt(ha.toFixed(1)+' hectáreas restauradas',W/2,225,26,'#f0d58c','center');
   txt(result=='win'?'Gracias a tu manglar, el aire de Guayaquil respira mejor.':'Cada hectárea cuenta: inténtalo otra vez.',W/2,275,18,'#e8f4ea','center')}
  txt('Toca la pantalla o pulsa Enter para '+(st=='menu'?'jugar':'reiniciar'),W/2,400,20,'#fff','center')}}
let last=performance.now();reset();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(st=='play')update(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
